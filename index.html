<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awas Hujan</title>
  <meta name="description" content="Live rain radar and rain alerts for your saved places.">
  <meta name="theme-color" content="#1769e0">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone "Add to Home Screen" -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Awas Hujan">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1b1f24;
      --muted: #5d6670;
      --border: #d9dee3;
      --accent: #1769e0;
      --warn-bg: #fff4d6;
      --warn-fg: #7a5200;
      --ok-bg: #e5f6ea;
      --ok-fg: #1d6b36;
      --bar: #2f80ed;
      --shadow: 0 2px 10px rgba(0, 0, 0, .18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c2128;
        --fg: #e6edf3;
        --muted: #9aa5b1;
        --border: #363d46;
        --accent: #5aa2ff;
        --warn-bg: #3d3210;
        --warn-fg: #ffd36b;
        --ok-bg: #173323;
        --ok-fg: #7fdc9b;
        --bar: #5aa2ff;
        --shadow: 0 2px 10px rgba(0, 0, 0, .5);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    #map { position: absolute; inset: 0; }

    .card {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    button {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Radar playback bar */
    #player {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      width: min(560px, calc(100% - 32px));
    }
    #player input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
    #frameTime { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
    #playBtn { width: 38px; padding: 6px 0; }

    /* Top-left title + controls */
    #header {
      position: absolute;
      top: 12px;
      left: 56px;
      z-index: 1000;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: calc(100% - 72px);
    }
    #header h1 { font-size: 16px; margin: 0; }
    #header label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    #opacity { width: 80px; accent-color: var(--accent); }

    /* Forecast panel */
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      width: 320px;
      max-height: calc(100% - 110px);
      overflow: auto;
      padding: 12px 14px;
    }
    #panel h2 { font-size: 15px; margin: 0 0 2px; }
    #panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    #panel .hint { color: var(--muted); }
    #panel .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .alert { border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-weight: 600; }
    .alert.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .alert.ok { background: var(--ok-bg); color: var(--ok-fg); }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; border-bottom: 1px solid var(--border); }
    .bars div { flex: 1; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 1px; }
    .bar-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 3px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 3px 0; border-bottom: 1px solid var(--border); }
    td:last-child, td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; }
    #panelToggle { display: none; }

    /* Saved places */
    #placesMenu {
      position: absolute;
      top: 64px;
      left: 56px;
      z-index: 1001;
      width: 260px;
      max-height: 50%;
      overflow: auto;
      padding: 10px 12px;
    }
    #placesMenu[hidden], #placeActions[hidden] { display: none; }
    .place-item { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); }
    .place-item:last-child { border-bottom: none; }
    .place-item button { border: none; background: none; }
    .place-item .go { flex: 1; text-align: left; padding: 7px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .place-item .go:hover { color: var(--accent); }
    .place-item .del { color: var(--muted); }
    .place-item .del:hover { color: #d33; }
    #placeActions { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    #placeActions .row { margin-top: 0; align-items: center; }
    #placeActions input {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
    }
    #placeActions .chips { margin-top: 8px; }
    .chips button { padding: 2px 10px; font-size: 12px; border-radius: 999px; }
    .leaflet-tooltip.place-label { font-weight: 600; padding: 1px 6px; }

    .leaflet-container { background: #aad3df; }
    .leaflet-bar a { background: var(--bg); color: var(--fg); border-color: var(--border); }

    @media (max-width: 640px) {
      #header { left: 52px; top: 10px; padding: 6px 10px; }
      #header label { display: none; }
      #panel {
        top: auto;
        bottom: 84px;
        left: 16px;
        right: 16px;
        width: auto;
        max-height: 45%;
      }
      #panel.collapsed > :not(#panelToggle) { display: none; }
      #panelToggle { display: block; float: right; padding: 2px 8px; }
      #placesMenu { left: 16px; right: 16px; width: auto; }
      #player { bottom: 16px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="header" class="card">
    <h1>☔ Awas Hujan</h1>
    <button id="locateBtn" class="primary" title="Use my location">📍 My location</button>
    <button id="placesBtn" aria-expanded="false" aria-controls="placesMenu">★ Places</button>
    <label>Radar opacity <input id="opacity" type="range" min="0.2" max="1" step="0.1" value="0.7"></label>
  </div>

  <div id="placesMenu" class="card" hidden>
    <div class="section-title" style="margin-top:0">Saved places</div>
    <div id="placesList"></div>
  </div>

  <div id="panel" class="card">
    <button id="panelToggle" aria-label="Collapse panel">–</button>
    <div id="panelBody">
      <h2>Rain forecast</h2>
      <p class="hint">Tap <b>My location</b> or click anywhere on the map to see the rain forecast for that spot.</p>
    </div>
    <div id="placeActions" hidden></div>
  </div>

  <div id="player" class="card">
    <button id="playBtn" aria-label="Play / pause">⏸</button>
    <input id="frameSlider" type="range" min="0" max="0" value="0" aria-label="Radar frame">
    <span id="frameTime">–</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // Radar: RainViewer public API (free, past ~2h in 10-min frames, native zoom up to 7).
    // Point forecast: Open-Meteo (free, no key, 15-minute precipitation).
    const RADAR_INDEX_URL = 'https://api.rainviewer.com/public/weather-maps.json';
    const RADAR_MAX_NATIVE_ZOOM = 7;
    const RADAR_COLOR_SCHEME = 2;   // "Universal Blue"
    const FRAME_DELAY_MS = 600;
    const LAST_FRAME_PAUSE_MS = 1500;
    const RADAR_REFRESH_MS = 5 * 60 * 1000;
    const FORECAST_REFRESH_MS = 10 * 60 * 1000;
    const RAIN_THRESHOLD_MM_PER_15MIN = 0.1;
    const DEFAULT_VIEW = { lat: 4.2, lng: 102.0, zoom: 6 }; // Peninsular Malaysia
    const STORAGE_KEYS = { view: 'awasHujan.view', places: 'awasHujan.places' };

    // localStorage can be unavailable (private mode, blocked site data), so never let it break the page.
    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ }
    }

    const storedView = loadJson(STORAGE_KEYS.view, null);
    const initialView = storedView && [storedView.lat, storedView.lng, storedView.zoom].every(Number.isFinite)
      ? storedView
      : DEFAULT_VIEW;

    const map = L.map('map', { zoomControl: true, worldCopyJump: true })
      .setView([initialView.lat, initialView.lng], initialView.zoom);

    map.on('moveend', () => {
      const center = map.getCenter().wrap();
      saveJson(STORAGE_KEYS.view, { lat: center.lat, lng: center.lng, zoom: map.getZoom() });
    });

    // Basemap: OpenStreetMap Humanitarian style hosted by OSM France
    // (tile.openstreetmap.org rejects localhost/dev referers; CARTO now needs an API key).
    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      subdomains: 'abc',
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles <a href="https://www.hotosm.org/">HOT</a> / <a href="https://openstreetmap.fr/">OSM France</a> | Radar &copy; <a href="https://www.rainviewer.com/">RainViewer</a> | Forecast <a href="https://open-meteo.com/">Open-Meteo</a>'
    }).addTo(map);

    // ---------- Radar animation ----------
    const playBtn = document.getElementById('playBtn');
    const slider = document.getElementById('frameSlider');
    const frameTimeEl = document.getElementById('frameTime');
    const opacityInput = document.getElementById('opacity');

    let radarHost = '';
    let frames = [];
    const radarLayers = {};     // frame path -> L.TileLayer
    let currentIndex = 0;
    let playing = true;
    let timer = null;

    function radarLayerFor(frame) {
      if (!radarLayers[frame.path]) {
        const url = `${radarHost}${frame.path}/256/{z}/{x}/{y}/${RADAR_COLOR_SCHEME}/1_1.png`;
        radarLayers[frame.path] = L.tileLayer(url, {
          tileSize: 256,
          opacity: 0,
          maxNativeZoom: RADAR_MAX_NATIVE_ZOOM,
          maxZoom: 18,
          zIndex: 10,
        });
      }
      return radarLayers[frame.path];
    }

    function formatTime(unixSeconds) {
      return new Date(unixSeconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showFrame(index) {
      if (!frames.length) return;
      const prev = frames[currentIndex];
      currentIndex = (index + frames.length) % frames.length;
      const frame = frames[currentIndex];

      const layer = radarLayerFor(frame);
      if (!map.hasLayer(layer)) map.addLayer(layer);
      layer.setOpacity(parseFloat(opacityInput.value));
      if (prev && prev !== frame && radarLayers[prev.path]) radarLayers[prev.path].setOpacity(0);

      // Preload the next frame so playback doesn't flash.
      const next = radarLayerFor(frames[(currentIndex + 1) % frames.length]);
      if (!map.hasLayer(next)) map.addLayer(next);

      slider.value = currentIndex;
      const isLatest = currentIndex === frames.length - 1;
      frameTimeEl.textContent = formatTime(frame.time) + (isLatest ? ' (latest)' : '');
    }

    function scheduleNext() {
      clearTimeout(timer);
      if (!playing) return;
      const delay = currentIndex === frames.length - 1 ? LAST_FRAME_PAUSE_MS : FRAME_DELAY_MS;
      timer = setTimeout(() => { showFrame(currentIndex + 1); scheduleNext(); }, delay);
    }

    function setPlaying(value) {
      playing = value;
      playBtn.textContent = playing ? '⏸' : '▶';
      scheduleNext();
    }

    async function loadRadar() {
      try {
        const res = await fetch(RADAR_INDEX_URL);
        const data = await res.json();
        radarHost = data.host;
        const newFrames = [...(data.radar.past || []), ...(data.radar.nowcast || [])];
        if (!newFrames.length) throw new Error('No radar frames');

        // Drop layers for frames that have aged out.
        const keep = new Set(newFrames.map(f => f.path));
        for (const path of Object.keys(radarLayers)) {
          if (!keep.has(path)) { map.removeLayer(radarLayers[path]); delete radarLayers[path]; }
        }

        frames = newFrames;
        slider.max = frames.length - 1;
        showFrame(frames.length - 1);
        scheduleNext();
      } catch (err) {
        frameTimeEl.textContent = 'Radar unavailable';
        console.error(err);
      }
    }

    playBtn.addEventListener('click', () => setPlaying(!playing));
    slider.addEventListener('input', () => { setPlaying(false); showFrame(parseInt(slider.value, 10)); });
    opacityInput.addEventListener('input', () => {
      if (frames.length) radarLayers[frames[currentIndex].path]?.setOpacity(parseFloat(opacityInput.value));
    });

    loadRadar();
    setInterval(loadRadar, RADAR_REFRESH_MS);

    // ---------- Point forecast & rain alarm ----------
    const panel = document.getElementById('panel');
    const panelBody = document.getElementById('panelBody');
    const panelToggle = document.getElementById('panelToggle');
    let pointMarker = null;
    let forecastPoint = null;   // { lat, lon, label }
    let forecastTimer = null;
    let lastNotifiedKey = '';

    panelToggle.addEventListener('click', () => {
      panel.classList.toggle('collapsed');
      panelToggle.textContent = panel.classList.contains('collapsed') ? '+' : '–';
    });

    function intensityLabel(mmPerHour) {
      if (mmPerHour < 0.4) return 'None';
      if (mmPerHour < 2.5) return 'Light';
      if (mmPerHour < 10) return 'Moderate';
      if (mmPerHour < 50) return 'Heavy';
      return 'Violent';
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function hhmm(isoLocal) {
      return isoLocal.slice(11, 16);
    }

    async function fetchForecast(lat, lon) {
      const params = new URLSearchParams({
        latitude: lat.toFixed(4),
        longitude: lon.toFixed(4),
        minutely_15: 'precipitation',
        hourly: 'precipitation_probability,precipitation',
        current: 'precipitation,temperature_2m',
        forecast_minutely_15: '8',
        forecast_hours: '12',
        timezone: 'auto',
      });
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!res.ok) throw new Error(`Forecast request failed (${res.status})`);
      return res.json();
    }

    function renderForecast(point, data) {
      const m = data.minutely_15;
      const h = data.hourly;
      const next2h = m.precipitation.map(v => v ?? 0);
      const firstRainIdx = next2h.findIndex(v => v >= RAIN_THRESHOLD_MM_PER_15MIN);
      const maxPerHour = Math.max(...next2h) * 4;

      let alertHtml;
      if (firstRainIdx === -1) {
        alertHtml = '<div class="alert ok">No rain expected in the next 2 hours</div>';
      } else if (firstRainIdx === 0) {
        alertHtml = `<div class="alert warn">🌧 Rain now — ${intensityLabel(next2h[0] * 4).toLowerCase()} (${(next2h[0] * 4).toFixed(1)} mm/h)</div>`;
      } else {
        alertHtml = `<div class="alert warn">🌧 Rain expected around ${hhmm(m.time[firstRainIdx])} — up to ${intensityLabel(maxPerHour).toLowerCase()}</div>`;
      }

      const barMax = Math.max(0.5, ...next2h);
      const bars = next2h.map((v, i) =>
        `<div style="height:${(v / barMax) * 100}%" title="${hhmm(m.time[i])}: ${(v * 4).toFixed(1)} mm/h"></div>`
      ).join('');

      const rows = h.time.map((t, i) => `
        <tr>
          <td>${hhmm(t)}</td>
          <td>${h.precipitation_probability[i] ?? '–'}%</td>
          <td>${(h.precipitation[i] ?? 0).toFixed(1)} mm</td>
        </tr>`).join('');

      const current = data.current;
      panelBody.innerHTML = `
        <h2>${escapeHtml(point.label)}</h2>
        <div class="sub">${point.lat.toFixed(3)}, ${point.lon.toFixed(3)} · ${Math.round(current.temperature_2m)}°C · updated ${hhmm(current.time)}</div>
        ${alertHtml}
        <div class="section-title">Next 2 hours (15-min steps, mm/h)</div>
        <div class="bars">${bars}</div>
        <div class="bar-labels"><span>${hhmm(m.time[0])}</span><span>${hhmm(m.time[m.time.length - 1])}</span></div>
        <div class="section-title">Next 12 hours</div>
        <table>
          <tr><td style="color:var(--muted)">Time</td><td style="color:var(--muted)">Chance</td><td style="color:var(--muted)">Amount</td></tr>
          ${rows}
        </table>
        <div class="row">
          <button id="notifyBtn">${notificationsEnabled() ? '🔔 Alerts on' : '🔕 Enable rain alerts'}</button>
        </div>`;

      document.getElementById('notifyBtn').addEventListener('click', enableNotifications);

      if (firstRainIdx !== -1) {
        notifyRain(point, `Rain ${firstRainIdx === 0 ? 'now' : 'from ' + hhmm(m.time[firstRainIdx])} at ${point.label}`, m.time[firstRainIdx]);
      }
    }

    async function updateForecast() {
      if (!forecastPoint) return;
      const point = forecastPoint;
      try {
        const data = await fetchForecast(point.lat, point.lon);
        if (point === forecastPoint) renderForecast(point, data);
      } catch (err) {
        panelBody.innerHTML = `<h2>${escapeHtml(point.label)}</h2><p class="hint">Couldn't load the forecast. ${escapeHtml(err.message)}</p>`;
      }
    }

    function selectPoint(lat, lon, label, placeId = null) {
      forecastPoint = { lat, lon, label, placeId };
      if (pointMarker) pointMarker.setLatLng([lat, lon]);
      else pointMarker = L.marker([lat, lon]).addTo(map);
      panelBody.innerHTML = `<h2>${escapeHtml(label)}</h2><p class="hint">Loading forecast…</p>`;
      panel.classList.remove('collapsed');
      panelToggle.textContent = '–';
      renderPlaceActions();
      updateForecast();
      clearInterval(forecastTimer);
      forecastTimer = setInterval(updateForecast, FORECAST_REFRESH_MS);
    }

    map.on('click', e => {
      closePlacesMenu();
      selectPoint(e.latlng.lat, e.latlng.lng, 'Selected point');
    });

    // ---------- Saved places (Home, Work, …) ----------
    const placesBtn = document.getElementById('placesBtn');
    const placesMenu = document.getElementById('placesMenu');
    const placesList = document.getElementById('placesList');
    const placeActions = document.getElementById('placeActions');
    const placesLayer = L.layerGroup().addTo(map);
    const QUICK_NAMES = ['Home', 'Work', 'School'];

    let places = loadJson(STORAGE_KEYS.places, [])
      .filter(p => p && typeof p.name === 'string' && Number.isFinite(p.lat) && Number.isFinite(p.lon));

    function persistPlaces() {
      saveJson(STORAGE_KEYS.places, places);
    }

    function selectPlace(place) {
      closePlacesMenu();
      map.setView([place.lat, place.lon], Math.max(map.getZoom(), 8));
      selectPoint(place.lat, place.lon, place.name, place.id);
    }

    function savePlace(name) {
      const point = forecastPoint;
      const trimmed = name.trim();
      if (!point || !trimmed) return;
      // Saving under an existing name (e.g. "Home") moves that place instead of adding a duplicate.
      const existing = places.find(p => p.name.toLowerCase() === trimmed.toLowerCase());
      const place = existing || { id: Date.now().toString(36) };
      Object.assign(place, { name: trimmed, lat: point.lat, lon: point.lon });
      if (!existing) places.push(place);
      persistPlaces();
      point.placeId = place.id;
      point.label = place.name;
      renderPlaces();
      renderPlaceActions();
      updateForecast();
    }

    function removePlace(id) {
      const place = places.find(p => p.id === id);
      if (!place || !confirm(`Remove "${place.name}" from saved places?`)) return;
      places = places.filter(p => p.id !== id);
      persistPlaces();
      renderPlaces();
      if (forecastPoint?.placeId === id) {
        forecastPoint.placeId = null;
        forecastPoint.label = 'Selected point';
        renderPlaceActions();
        updateForecast();
      }
    }

    function renderPlaces() {
      placesLayer.clearLayers();
      for (const place of places) {
        L.circleMarker([place.lat, place.lon], {
          radius: 7, color: '#fff', weight: 2, fillColor: '#1769e0', fillOpacity: 1,
          bubblingMouseEvents: false,
        })
          .bindTooltip(escapeHtml(place.name), { permanent: true, direction: 'right', offset: [8, 0], className: 'place-label' })
          .on('click', () => selectPlace(place))
          .addTo(placesLayer);
      }

      placesList.innerHTML = places.length
        ? places.map(p => `
            <div class="place-item">
              <button class="go" data-id="${p.id}">★ ${escapeHtml(p.name)}</button>
              <button class="del" data-id="${p.id}" aria-label="Remove ${escapeHtml(p.name)}" title="Remove">✕</button>
            </div>`).join('')
        : '<p class="hint" style="margin:0">No saved places yet. Pick a spot on the map, then tap <b>Save this place</b>.</p>';
    }

    function renderPlaceActions() {
      const point = forecastPoint;
      placeActions.hidden = !point;
      if (!point) return;

      const place = places.find(p => p.id === point.placeId);
      if (place) {
        placeActions.innerHTML = `
          <div class="row">
            <span style="flex:1">★ Saved as <b>${escapeHtml(place.name)}</b></span>
            <button id="removePlaceBtn">Remove</button>
          </div>`;
        document.getElementById('removePlaceBtn').addEventListener('click', () => removePlace(place.id));
      } else {
        placeActions.innerHTML = '<button id="savePlaceBtn">☆ Save this place</button>';
        document.getElementById('savePlaceBtn').addEventListener('click', showSaveForm);
      }
    }

    function showSaveForm() {
      placeActions.innerHTML = `
        <form id="savePlaceForm" class="row">
          <input id="placeNameInput" maxlength="40" placeholder="Name, e.g. Home" required>
          <button type="submit" class="primary">Save</button>
          <button type="button" id="cancelSaveBtn">Cancel</button>
        </form>
        <div class="row chips">
          ${QUICK_NAMES.map(n => `<button type="button" data-name="${n}">${n}</button>`).join('')}
        </div>`;
      const input = document.getElementById('placeNameInput');
      input.focus();
      document.getElementById('savePlaceForm').addEventListener('submit', e => {
        e.preventDefault();
        savePlace(input.value);
      });
      document.getElementById('cancelSaveBtn').addEventListener('click', renderPlaceActions);
      placeActions.querySelectorAll('.chips button').forEach(btn =>
        btn.addEventListener('click', () => { input.value = btn.dataset.name; input.focus(); }));
    }

    function openPlacesMenu() {
      const header = document.getElementById('header');
      placesMenu.style.top = `${header.offsetTop + header.offsetHeight + 8}px`;
      placesMenu.hidden = false;
      placesBtn.setAttribute('aria-expanded', 'true');
    }

    function closePlacesMenu() {
      placesMenu.hidden = true;
      placesBtn.setAttribute('aria-expanded', 'false');
    }

    placesBtn.addEventListener('click', () => (placesMenu.hidden ? openPlacesMenu() : closePlacesMenu()));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlacesMenu(); });
    placesList.addEventListener('click', e => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      if (btn.classList.contains('del')) {
        removePlace(btn.dataset.id);
      } else {
        const place = places.find(p => p.id === btn.dataset.id);
        if (place) selectPlace(place);
      }
    });

    renderPlaces();

    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], Math.max(map.getZoom(), 8));
          selectPoint(latitude, longitude, 'My location');
        },
        err => alert(`Couldn't get your location: ${err.message}`),
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    });

    // ---------- Browser notifications ----------
    function notificationsEnabled() {
      return 'Notification' in window && Notification.permission === 'granted';
    }

    async function enableNotifications() {
      if (!('Notification' in window)) { alert('Notifications are not supported by this browser.'); return; }
      const result = await Notification.requestPermission();
      const btn = document.getElementById('notifyBtn');
      if (btn) btn.textContent = result === 'granted' ? '🔔 Alerts on' : '🔕 Alerts blocked';
      if (result === 'granted') updateForecast();
    }

    function notifyRain(point, message, rainTime) {
      if (!notificationsEnabled()) return;
      // Only notify once per location + rain start time.
      const key = `${point.lat.toFixed(2)},${point.lon.toFixed(2)}@${rainTime}`;
      if (key === lastNotifiedKey) return;
      lastNotifiedKey = key;
      new Notification('☔ Awas Hujan', { body: message, tag: 'awas-hujan' });
    }
  </script>
</body>
</html>
